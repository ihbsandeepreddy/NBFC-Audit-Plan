version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: nbfc_db
    environment:
      POSTGRES_DB: nbfc_audit_dev
      POSTGRES_USER: nbfc_user
      POSTGRES_PASSWORD: nbfc_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbfc_user -d nbfc_audit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (WebSocket pub/sub + session cache)
  redis:
    image: redis:7-alpine
    container_name: nbfc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nbfc_backend
    environment:
      DATABASE_URL: postgresql://nbfc_user:nbfc_pass@db:5432/nbfc_audit_dev
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production-minimum-32-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      MAX_UPLOAD_SIZE_MB: 500
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:80"]'
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      BACKEND_RELOAD: "false"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # React Frontend (production build via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nbfc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Reverse Proxy (API gateway)
  nginx:
    image: nginx:alpine
    container_name: nbfc_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
